[project]
name = "collector-local-backend"
version = "0.1.0"
description = "Local FastAPI backend for the collector AI workflow prototype."
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "curl-cffi>=0.13,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
  "B008",
  "BLE001"
]
